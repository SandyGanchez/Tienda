<ion-split-pane [contentId]="contentId" when="(min-width: 992px)">
  <ion-menu side="start" [contentId]="contentId" [menuId]="menuId" type="overlay" class="admin-menu">
    <ion-header class="admin-menu-header">
      <ion-toolbar>
        <div class="store-brand">
          <div class="brand-logo">
            <img *ngIf="resolverLogo() as logo; else logoFallback" [src]="logo" alt="Logo de la tienda">
            <ng-template #logoFallback><ion-icon name="storefront-outline"></ion-icon></ng-template>
          </div>
          <div class="brand-copy"><strong>{{ nombreTienda }}</strong><small>Administración</small></div>
        </div>
      </ion-toolbar>
    </ion-header>

    <ion-content class="admin-menu-content">
      <ion-list lines="none">
        <ion-menu-toggle [autoHide]="false">
          <ng-container *ngIf="esAdministrador">
            <div class="menu-section-label">Inicio</div>
            <ion-item button detail="false" routerLink="/home" [queryParams]="{ seccion: 'inicio' }" [class.menu-active]="activeSection === 'inicio'">
              <ion-icon slot="start" name="home-outline"></ion-icon><ion-label>Inicio</ion-label>
            </ion-item>

            <div class="menu-section-label">Gestión</div>
            <ion-item button detail="false" routerLink="/home" [queryParams]="{ seccion: 'productos' }" [class.menu-active]="activeSection === 'productos'">
              <ion-icon slot="start" name="cube-outline"></ion-icon><ion-label>Productos</ion-label>
            </ion-item>
            <ion-item button detail="false" routerLink="/home" [queryParams]="{ seccion: 'categorias' }" [class.menu-active]="activeSection === 'categorias'">
              <ion-icon slot="start" name="grid-outline"></ion-icon><ion-label>Categorías</ion-label>
            </ion-item>
            <ion-item button detail="false" routerLink="/home" [queryParams]="{ seccion: 'marcas' }" [class.menu-active]="activeSection === 'marcas'">
              <ion-icon slot="start" name="pricetag-outline"></ion-icon><ion-label>Marcas</ion-label>
            </ion-item>

            <div class="menu-section-label">Personal</div>
            <ion-item button detail="false" routerLink="/empleados" [class.menu-active]="activeSection === 'empleados'">
              <ion-icon slot="start" name="people-outline"></ion-icon><ion-label>Empleados</ion-label>
            </ion-item>
          </ng-container>

          <div class="menu-section-label">Operación</div>
          <ion-item button detail="false" routerLink="/cajero" [class.menu-active]="activeSection === 'cajero'">
            <ion-icon slot="start" name="cart-outline"></ion-icon><ion-label>Punto de venta</ion-label>
          </ion-item>
          <ion-item button detail="false" routerLink="/ventas" [class.menu-active]="activeSection === 'ventas'">
            <ion-icon slot="start" name="receipt-outline"></ion-icon><ion-label>Ventas</ion-label>
          </ion-item>
          <ion-item *ngIf="esAdministrador" button detail="false" routerLink="/pedidos-online" [class.menu-active]="activeSection === 'pedidos-online'">
            <ion-icon slot="start" name="bag-check-outline"></ion-icon><ion-label>Pedidos online</ion-label>
          </ion-item>

          <ng-container *ngIf="esAdministrador">
            <div class="menu-section-label">Sistema</div>
            <ion-item button detail="false" routerLink="/home" [queryParams]="{ seccion: 'configuracion' }" [class.menu-active]="activeSection === 'configuracion'">
              <ion-icon slot="start" name="settings-outline"></ion-icon><ion-label>Configuración</ion-label>
            </ion-item>
          </ng-container>
        </ion-menu-toggle>
      </ion-list>

      <div class="admin-user">
        <div class="admin-avatar">
          <img *ngIf="resolverAvatar() as avatar; else avatarFallback" [src]="avatar" alt="Foto del empleado">
          <ng-template #avatarFallback><ion-icon name="person-outline"></ion-icon></ng-template>
        </div>
        <div class="admin-user-copy">
          <strong>{{ auth.sesion?.empleado?.nombre || 'Usuario' }}</strong>
          <small>{{ auth.sesion?.empleado?.cargo || 'EMPLEADO' }}</small>
        </div>
        <ion-button fill="clear" aria-label="Cerrar sesión" title="Cerrar sesión" (click)="auth.logout()">
          <ion-icon slot="icon-only" name="log-out-outline"></ion-icon>
        </ion-button>
      </div>
    </ion-content>
  </ion-menu>

  <div class="ion-page admin-shell-content" [id]="contentId">
    <ng-content></ng-content>
  </div>
</ion-split-pane>
