<div class="relative w-full font-sans select-none">
  <!-- Trigger Button -->
  <button
    type="button"
    [id]="triggerId"
    [disabled]="disabled"
    class="w-full flex items-center justify-between text-left transition-all duration-200 outline-none group"
    [ngClass]="[
      compact ? 'py-2 px-3 text-xs rounded-lg' : 'py-3 px-4 text-sm rounded-xl',
      isOpen ? 'ring-2 ring-primary/20 border-primary bg-surface-container-lowest shadow-sm' : 'border border-outline-variant/30 bg-surface-container hover:border-outline-variant/60 focus:border-primary',
      disabled ? 'opacity-50 cursor-not-allowed bg-surface-variant/40' : 'cursor-pointer'
    ]"
  >
    <div class="flex items-center gap-2.5 overflow-hidden truncate">
      <span class="material-symbols-outlined text-lg text-primary/80 shrink-0">
        calendar_today
      </span>
      <span
        class="truncate"
        [ngClass]="selectedLabel ? 'text-on-surface font-medium' : 'text-on-surface-variant/60'"
      >
        {{ selectedLabel || placeholder }}
      </span>
    </div>

    <div class="flex items-center gap-1.5 shrink-0 ml-2">
      <!-- Clear button (if clearable and has value) -->
      <span
        *ngIf="clearable && selectedValue && !disabled"
        (click)="clearSelection($event)"
        class="material-symbols-outlined text-[16px] text-on-surface-variant/50 hover:text-error hover:bg-error/10 p-0.5 rounded-full transition-colors"
        title="Limpiar fecha"
      >
        close
      </span>

      <!-- Expand indicator -->
      <span
        class="material-symbols-outlined text-xl text-on-surface-variant/70 transition-transform duration-200"
        [class.rotate-180]="isOpen"
      >
        expand_more
      </span>
    </div>
  </button>

  <!-- Ionic Popover with Datetime -->
  <ion-popover
    #popover
    [trigger]="triggerId"
    triggerAction="click"
    (willPresent)="onPopoverWillPresent()"
    (didDismiss)="onPopoverDismiss()"
    alignment="start"
    side="bottom"
    [arrow]="false"
    class="custom-datepicker-popover"
  >
    <ng-template>
      <div class="p-2.5 bg-surface-container-lowest rounded-2xl shadow-2xl border border-surface-variant/30 font-sans">
        <!-- Quick shortcuts header -->
        <div *ngIf="showShortcuts" class="flex items-center justify-between gap-1.5 p-1 mb-2 bg-surface-container/60 rounded-xl border border-surface-variant/20">
          <button
            type="button"
            (click)="setToday($event)"
            class="flex-1 py-1 px-2 text-xs font-sans font-medium text-primary hover:bg-primary/10 rounded-lg transition-colors text-center cursor-pointer active:scale-95"
          >
            Hoy
          </button>
          <button
            type="button"
            (click)="setYesterday($event)"
            class="flex-1 py-1 px-2 text-xs font-sans font-medium text-on-surface-variant hover:bg-surface-variant/30 rounded-lg transition-colors text-center cursor-pointer active:scale-95"
          >
            Ayer
          </button>
          <button
            *ngIf="clearable && selectedValue"
            type="button"
            (click)="clearSelection($event)"
            class="flex-1 py-1 px-2 text-xs font-sans font-medium text-error hover:bg-error/10 rounded-lg transition-colors text-center cursor-pointer active:scale-95"
          >
            Limpiar
          </button>
        </div>

        <!-- Ion Datetime picker -->
        <ion-datetime
          #datetime
          presentation="date"
          locale="es-MX"
          [value]="internalIso"
          (ionChange)="onDateChanged($event)"
          [min]="min"
          [max]="max"
          [showDefaultButtons]="true"
          doneText="Listo"
          cancelText="Cancelar"
          (ionCancel)="popover.dismiss()"
          class="custom-ion-datetime"
        >
          <span slot="title" class="font-sans font-semibold text-xs text-primary tracking-wide">
            {{ title || label || 'Selecciona una fecha' }}
          </span>
        </ion-datetime>
      </div>
    </ng-template>
  </ion-popover>
</div>
