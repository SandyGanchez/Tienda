<div class="relative w-full font-sans">
  <!-- Trigger Button -->
  <button
    type="button"
    [id]="triggerId"
    [disabled]="disabled"
    (click)="openModal()"
    class="w-full flex items-center justify-between text-left transition-all duration-200 outline-none group select-none"
    [ngClass]="[
      compact ? 'py-2 px-3 text-xs rounded-lg' : 'py-3 px-4 text-sm rounded-xl',
      isModalOpen ? 'ring-2 ring-primary/20 border-primary bg-surface-container-lowest shadow-sm' : 'border border-outline-variant/30 bg-surface-container hover:border-outline-variant/60 focus:border-primary',
      disabled ? 'opacity-50 cursor-not-allowed bg-surface-variant/40' : 'cursor-pointer'
    ]"
  >
    <div class="flex items-center gap-2.5 overflow-hidden truncate">
      <span class="material-symbols-outlined text-lg text-primary/80 shrink-0">
        calendar_today
      </span>
      <span
        class="truncate"
        [ngClass]="selectedLabel ? 'text-on-surface font-medium' : 'text-on-surface-variant/60'"
      >
        {{ selectedLabel || placeholder }}
      </span>
    </div>

    <div class="flex items-center gap-1.5 shrink-0 ml-2">
      <!-- Clear button (if clearable and has value) -->
      <span
        *ngIf="clearable && selectedValue && !disabled"
        (click)="clearSelection($event)"
        class="material-symbols-outlined text-[16px] text-on-surface-variant/50 hover:text-error hover:bg-error/10 p-0.5 rounded-full transition-colors"
        title="Limpiar fecha"
      >
        close
      </span>

      <!-- Expand indicator -->
      <span
        class="material-symbols-outlined text-xl text-on-surface-variant/70 transition-transform duration-200"
      >
        calendar_month
      </span>
    </div>
  </button>

  <!-- Centered Ionic Modal -->
  <ion-modal
    #modal
    [isOpen]="isModalOpen"
    (didDismiss)="onModalDismiss()"
    class="centered-datepicker-modal"
    [backdropDismiss]="true"
  >
    <ng-template>
      <div class="bg-surface-container-lowest rounded-[28px] shadow-2xl border border-surface-variant/30 overflow-hidden flex flex-col font-sans p-4 sm:p-5">
        <!-- Header -->
        <div class="flex items-center justify-between pb-3 mb-2 border-b border-surface-variant/20">
          <div class="flex items-center gap-2.5">
            <div class="w-9 h-9 rounded-full bg-primary/10 flex items-center justify-center text-primary">
              <span class="material-symbols-outlined text-xl">event</span>
            </div>
            <div>
              <h3 class="font-heading font-bold text-base text-on-surface leading-tight">
                {{ title || label || 'Seleccionar fecha' }}
              </h3>
              <p *ngIf="selectedLabel" class="text-xs text-primary font-medium font-sans">
                {{ selectedLabel }}
              </p>
            </div>
          </div>
          <button
            type="button"
            (click)="closeModal()"
            class="w-8 h-8 rounded-full flex items-center justify-center text-on-surface-variant hover:bg-surface-variant/40 transition-colors cursor-pointer"
          >
            <span class="material-symbols-outlined text-lg">close</span>
          </button>
        </div>

        <!-- Quick Shortcuts -->
        <div *ngIf="showShortcuts" class="flex items-center justify-between gap-1.5 p-1 mb-2 bg-surface-container/60 rounded-xl border border-surface-variant/20">
          <button
            type="button"
            (click)="setToday($event)"
            class="flex-1 py-1.5 px-2 text-xs font-sans font-semibold text-primary hover:bg-primary/10 rounded-lg transition-colors text-center cursor-pointer active:scale-95"
          >
            Hoy
          </button>
          <button
            type="button"
            (click)="setYesterday($event)"
            class="flex-1 py-1.5 px-2 text-xs font-sans font-semibold text-on-surface-variant hover:bg-surface-variant/40 rounded-lg transition-colors text-center cursor-pointer active:scale-95"
          >
            Ayer
          </button>
          <button
            *ngIf="clearable"
            type="button"
            (click)="clearSelection($event)"
            class="flex-1 py-1.5 px-2 text-xs font-sans font-semibold text-error hover:bg-error/10 rounded-lg transition-colors text-center cursor-pointer active:scale-95"
          >
            Todas
          </button>
        </div>

        <!-- Ion-datetime centered -->
        <div class="flex justify-center items-center py-1">
          <ion-datetime
            #datetime
            presentation="date"
            locale="es-MX"
            [value]="internalIso"
            (ionChange)="onDatePicked($event)"
            [min]="min"
            [max]="max"
            class="custom-centered-datetime"
          ></ion-datetime>
        </div>

        <!-- Footer Actions -->
        <div class="flex gap-2.5 pt-3 mt-2 border-t border-surface-variant/20 w-full">
          <button
            type="button"
            (click)="closeModal()"
            class="flex-1 py-2.5 px-4 rounded-xl border border-outline-variant/30 font-sans font-medium text-xs text-on-surface-variant hover:bg-surface transition-colors active:scale-95 cursor-pointer"
          >
            Cancelar
          </button>
          <button
            type="button"
            (click)="confirmSelection()"
            class="flex-1 py-2.5 px-4 rounded-xl bg-primary hover:bg-primary-container text-on-primary font-sans font-bold text-xs shadow-md transition-all active:scale-95 cursor-pointer"
          >
            Aceptar
          </button>
        </div>
      </div>
    </ng-template>
  </ion-modal>
</div>
